# Weekly dependency updates. Minor and patch bumps come as one pull request per
# ecosystem, so a quiet week is one review, not ten; a major bump comes alone,
# because that is the one that can break something.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/spike"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
